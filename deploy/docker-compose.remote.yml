# fin-terminal —— 远程 API 模式（消费者）编排
#
# 适用：新服务器不持有市场数据库、不跑采集 worker，
#       行情/财务/快照全部通过源服务器的 /api/market/data 读取。
#
# 与独立部署（docker-compose.yml）的区别：
#   - 没有 postgres、没有 worker 两个服务
#   - 必须设置 MARKET_DATA_MODE=remote 与源站地址、访问令牌
#   - 不写本地市场库；源站不可用时明确报错，不会静默回落
#   - 个人账号数据仍存本机（配置 DATABASE_URL 走 Postgres，不配则用文件存储）
#
# 启动：
#   cp deploy/.env.remote.example deploy/.env.remote && vi deploy/.env.remote
#   docker compose -f deploy/docker-compose.remote.yml --env-file deploy/.env.remote up -d --build
#
# 本文件中所有密钥均为占位符，真实值只存在于未纳入版本库的 deploy/.env.remote。

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: fin-terminal:latest
    container_name: fin-web-remote
    restart: unless-stopped
    environment:
      PORT: '3000'
      TZ: Asia/Shanghai
      NODE_ENV: production

      # ---- 远程消费模式三件套（必填）----
      MARKET_DATA_MODE: remote
      MARKET_DATA_API_URL: ${MARKET_DATA_API_URL:?请设置源站地址，例如 https://source.example.com/api/market/data}
      MARKET_DATA_API_ACCESS_TOKEN: ${MARKET_DATA_API_ACCESS_TOKEN:?请填写与源服务器 MARKET_DATA_API_TOKEN 相同的令牌}

      # ---- 账号数据（仍在本服务器，可选）----
      # 不设置则回落到文件存储，容器重启会丢失，生产建议配置
      DATABASE_URL: ${DATABASE_URL:-}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-}
      APP_ORIGIN: ${PUBLIC_ORIGIN:?请设置公网访问地址}

      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-8000}
    ports:
      - '127.0.0.1:${WEB_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
