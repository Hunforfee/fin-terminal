# fin-terminal 反向代理示例
#
# 放置：/etc/nginx/conf.d/fin-terminal.conf
# 证书路径按你的实际签发方式调整（certbot / 云厂商证书）。
#
# 关键点：
#   1. proxy_read_timeout 必须放大。财务对比等接口在冷启动时会同步等待上游抓取，
#      实测可达 6–25 秒，默认 60s 在弱网下仍可能触发 504，这里给到 180s。
#   2. 不要压缩已压缩内容；行情/财务响应为 JSON，gzip 收益有限但会增加 CPU。
#   3. 维护端与 worker 端点建议限制来源，不要直接暴露公网。

upstream fin_terminal {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name fin.example.com;
    # 除 ACME 校验外全部跳转 HTTPS
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name fin.example.com;

    # ---- 占位符：替换为你的真实证书路径 ----
    ssl_certificate     /etc/nginx/certs/fin.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/fin.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;

    client_max_body_size 20m;

    # ---- 维护端 / worker 调度端点：仅允许内网或本机 ----
    location /api/market-updates/ {
        allow 127.0.0.1;
        # 若 worker 走公网 HTTPS 回源，改为允许 worker 出口 IP：
        # allow 203.0.113.10;
        deny all;
        include /etc/nginx/conf.d/fin-proxy.inc;
    }

    location / {
        include /etc/nginx/conf.d/fin-proxy.inc;
    }
}
