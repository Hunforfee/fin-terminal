; ============================================================
; fin-terminal 服务栈 —— 注册到平台 supervisord（2026-10-24）
;
; 背景：沙箱平台会在固定时刻（实测 20:08 / 21:33）SIGKILL 回收未注册进程，
; 此前 watchdog + cron 两层保活均因自身一并被杀而失效，PG 两次非正常退出。
; 注册到平台进程管理器后，autorestart=true 由平台在进程退出时自动拉起。
;
; 摘除方式：删除本文件后执行 RPC reloadConfig 即可，不影响其他受管程序。
; 注意：服务已整体移交此处，watchdog 不再巡检服务端口（避免双重启动冲突）。
; ============================================================

; ---- PostgreSQL 16（前台运行；命令与 pg_ctlcluster 内部一致，另加 -c ssl=off）----
; ssl=off 原因：postgres 用户不在 ssl-cert 补充组，读不了 snakeoil 私钥（Debian 默认 ssl=on）；
; 而 supervisord 的 user= 不初始化补充组（setuid 不含 initgroups），pg_ctlcluster 走的 su 却会。
; 本服务仅监听 127.0.0.1、viewer/web 均本地连接，无需 SSL；如需开启应改为把密钥交给 postgres 可读。
[program:fin-postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/16/main -c config_file=/etc/postgresql/16/main/postgresql.conf -c ssl=off
directory=/var/lib/postgresql/16/main
user=postgres
autostart=true
autorestart=true
startsecs=3
startretries=5
priority=10
stopsignal=INT          ; postgres 快速停止：等待会话结束后退出
stopwaitsecs=60
stdout_logfile=/tmp/fin-postgres.log
stdout_logfile_maxbytes=20MB
redirect_stderr=true

; ---- market-data-viewer（3112，只读查看器；.env 自加载）----
[program:fin-viewer]
command=/root/.nvm/versions/node/v22.13.1/bin/node server.js
directory=/workspace/market-data-viewer
environment=PORT="3112"
autostart=true
autorestart=true
startsecs=2
startretries=5
priority=20
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/tmp/fin-viewer.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

; ---- Next.js web（3000；.env.local 由 Next.js 自动加载）----
[program:fin-web]
command=/root/.nvm/versions/node/v22.13.1/bin/npm run start
directory=/workspace/fin-terminal
environment=PORT="3000",NODE_ENV="production",PATH="/root/.nvm/versions/node/v22.13.1/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
autostart=true
autorestart=true
startsecs=8
startretries=5
priority=30
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/tmp/fin-web.log
stdout_logfile_maxbytes=20MB
redirect_stderr=true

; ---- market worker（常驻市场数据更新 + 批量导入队列推进）----
; 纯 HTTP 客户端（零 import，不连库、不依赖 node_modules）；
; MARKET_UPDATE_ORIGIN / MARKET_UPDATE_WORKER_TOKEN 由 .env.local 注入，密钥不落在本文件。
[program:fin-worker]
command=/bin/bash -c "set -a; . /workspace/fin-terminal/.env.local; set +a; exec /root/.nvm/versions/node/v22.13.1/bin/node scripts/market-update-worker.mjs"
directory=/workspace/fin-terminal
autostart=true
autorestart=true
startsecs=3
startretries=10
priority=40
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/tmp/fin-worker.log
stdout_logfile_maxbytes=10MB
redirect_stderr=true

; ---- watchdog（仅每日数据库备份 + 心跳；服务保活归上面四个 program）----
[program:fin-watchdog]
command=/bin/bash /root/.codebuddy/artifact/2f8a7d30-9c21-4f0b-1d4c-d61e47195000/sandbox-watchdog.sh
autostart=true
autorestart=true
startsecs=1
startretries=5
priority=50
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/tmp/fin-watchdog.log
stdout_logfile_maxbytes=5MB
redirect_stderr=true
