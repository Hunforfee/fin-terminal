services:
  fin-terminal:
    build: .
    image: fin-terminal:latest
    container_name: fin-terminal
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # 上游超时（毫秒）
      UPSTREAM_TIMEOUT_MS: '8000'
      TZ: 'Asia/Shanghai'
      MARKET_READ_MODE: '${MARKET_READ_MODE:-hybrid}'
      # 接入同花顺 iFinD 后取消注释，即可把财务摘要切换为真实财报口径
      # IFIND_BASE_URL: 'https://your-ifind-gateway/v1'
      # IFIND_TOKEN: 'your-token'
      # 若走 MCP 网关（当前账号侧注册未完成，会返回 17008）
      # IFIND_MCP_URL: 'http://iFinD-MCP.agent-gateway.auth-proxy.local/ds-mcp-servers/hexin-ifind-financial-mcp'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
